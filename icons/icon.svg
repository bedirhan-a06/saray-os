    <rect x="0" y="0" width="164" height="280" rx="30" fill="#c8f04a"/>
    <rect x="196" y="0" width="84" height="130" rx="22" fill="#c8f04a"/>
    <rect x="196" y="150" width="84" height="130" rx="22" fill="#f5f5f5"/>
  </g>
</svg>
