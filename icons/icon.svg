<svg xmlns="http://www.w3.org/2000/svg" width="512" height="512" viewBox="0 0 512 512">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#1c2130"/>
      <stop offset="100%" stop-color="#0d0f14"/>
    </linearGradient>
    <!-- userSpaceOnUse: der Verlauf laeuft ueber alle drei Kacheln hinweg,
         nicht in jeder einzeln. So bleibt es ein Zeichen, das in Module
         geschnitten ist – und nicht drei zufaellig benachbarte Rechtecke. -->
    <linearGradient id="gold" gradientUnits="userSpaceOnUse" x1="116" y1="116" x2="396" y2="396">
      <stop offset="0%" stop-color="#f6e7b0"/>
      <stop offset="45%" stop-color="#d4af37"/>
      <stop offset="100%" stop-color="#a97f1f"/>
    </linearGradient>
  </defs>
  <rect width="512" height="512" fill="url(#bg)"/>
  <!-- Ein grosser Baustein, zwei kleinere daneben – dasselbe Verhaeltnis,
       in dem die App ihre Uebersicht aufbaut. Die Rangfolge traegt die
       Groesse, nicht die Helligkeit: nur so bleiben alle drei Kacheln
       auch als 60-px-Symbol auf dem Homebildschirm lesbar. -->
  <g transform="translate(116,116)">
    <rect x="0" y="0" width="164" height="280" rx="30" fill="url(#gold)"/>
    <rect x="196" y="0" width="84" height="130" rx="22" fill="url(#gold)"/>
    <rect x="196" y="150" width="84" height="130" rx="22" fill="url(#gold)"/>
  </g>
</svg>
